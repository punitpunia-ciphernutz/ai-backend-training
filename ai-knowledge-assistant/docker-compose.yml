services:

  api:

    build: .

    container_name: ai-knowledge-assistant

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db

    depends_on:
      - redis

    restart: unless-stopped

  redis:

    image: redis:7-alpine

    container_name: redis-cache

    ports:
      - "6379:6379"

    restart: unless-stopped